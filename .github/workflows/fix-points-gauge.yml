name: Réparer la jauge de points

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-points-gauge.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser la jauge avec le score visible
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "pointsGaugeRepairV3"
          repair = r"""
          <script id="pointsGaugeRepairV3">
          (function(){
            if(window.pointsGaugeRepairV3)return;
            window.pointsGaugeRepairV3=true;
            let previous=0,points=0,missed=false,started=false;
            function numberIn(el){
              return Number(((el&&el.textContent||'').match(/d+/)||[0])[0]);
            }
            setInterval(()=>{
              const score=document.getElementById('score');
              const pointsEl=document.querySelector('#ultimateHUD .pts b');
              const feedback=document.getElementById('feedback');
              if(!score||!pointsEl)return;
              const current=numberIn(score);
              if(!started){
                previous=current;
                points=numberIn(pointsEl);
                started=true;
              }
              if(feedback&&feedback.classList.contains('bad'))missed=true;
              if(current<previous){
                previous=current;
                missed=false;
              }else if(current>previous){
                points+=(current-previous)*(missed?5:10);
                pointsEl.textContent=points;
                previous=current;
                missed=false;
              }
            },120);
          })();
          </script>
          """
          for name in ("back-to-school", "drinks"):
              path=Path("lessons")/name/"index.html"
              text=path.read_text(encoding="utf-8")
              if marker not in text:
                  text=text.replace("</body>",repair+"</body>",1)
                  path.write_text(text,encoding="utf-8")
          PY
      - name: Publier
        run: |
          git config user.name "ZouMai automation"
          git config user.email "actions@users.noreply.github.com"
          git add lessons/back-to-school/index.html lessons/drinks/index.html
          git diff --cached --quiet || git commit -m "Synchroniser la jauge avec le score visible"
          git push
